<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Почта · Mailroom</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="mail-page">
  <header class="mail-header">
    <div class="mail-brand">
      <span class="brand-mark">M</span>
      <span>Mailroom Mail</span>
    </div>
    <div class="mail-user" id="mail-user">
      <span id="mail-address">Загрузка...</span>
      <button class="logout-button" id="mail-logout">Выйти</button>
    </div>
  </header>

  <div class="mail-container">
    <aside class="mail-sidebar">
      <nav class="mail-folders" id="mail-folders">
        <div class="folder-section">
          <span class="folder-section-title">Папки</span>
          <button class="folder-item active" data-folder="INBOX">
            <span class="folder-icon">📥</span>
            <span class="folder-name">Входящие</span>
            <span class="folder-count" id="count-INBOX">0</span>
          </button>
          <button class="folder-item" data-folder="Sent">
            <span class="folder-icon">📤</span>
            <span class="folder-name">Отправленные</span>
            <span class="folder-count" id="count-Sent">0</span>
          </button>
          <button class="folder-item" data-folder="Drafts">
            <span class="folder-icon">📝</span>
            <span class="folder-name">Черновики</span>
            <span class="folder-count" id="count-Drafts">0</span>
          </button>
          <button class="folder-item" data-folder="Trash">
            <span class="folder-icon">🗑</span>
            <span class="folder-name">Корзина</span>
            <span class="folder-count" id="count-Trash">0</span>
          </button>
          <button class="folder-item" data-folder="Spam">
            <span class="folder-icon">🚫</span>
            <span class="folder-name">Спам</span>
            <span class="folder-count" id="count-Spam">0</span>
          </button>
        </div>
      </nav>

      <div class="mail-compose-btn">
        <button class="primary-button compose-btn" id="compose-btn">
          <span>✎</span> Написать
        </button>
      </div>
    </aside>

    <main class="mail-main">
      <div class="mail-toolbar">
        <div class="toolbar-left">
          <input type="text" class="search-input" id="search-input" placeholder="Поиск писем...">
          <button class="icon-button refresh-btn" id="refresh-btn" title="Обновить">↻</button>
        </div>
        <div class="toolbar-right">
          <div class="pagination" id="pagination">
            <button class="icon-button" id="prev-page" disabled>←</button>
            <span class="page-info" id="page-info">1 / 1</span>
            <button class="icon-button" id="next-page" disabled>→</button>
          </div>
        </div>
      </div>

      <div class="mail-list-container">
        <table class="mail-list" id="mail-list">
          <thead>
            <tr>
              <th class="col-checkbox"><input type="checkbox" id="select-all"></th>
              <th class="col-star">★</th>
              <th class="col-from">Отправитель</th>
              <th class="col-subject">Тема</th>
              <th class="col-date">Дата</th>
              <th class="col-size">Размер</th>
              <th class="col-attach"></th>
            </tr>
          </thead>
          <tbody id="mail-list-body">
            <tr class="loading-row"><td colspan="7">Загрузка писем...</td></tr>
          </tbody>
        </table>
      </div>

      <div class="mail-empty" id="mail-empty" style="display: none;">
        <div class="empty-state">
          <span class="empty-icon">📭</span>
          <p>В этой папке нет писем</p>
        </div>
      </div>
    </main>

    <aside class="mail-reader" id="mail-reader">
      <div class="reader-placeholder">
        <span class="reader-icon">📧</span>
        <p>Выберите письмо для чтения</p>
      </div>
      <article class="reader-content" id="reader-content" style="display: none;">
        <header class="message-header">
          <h1 class="message-subject" id="message-subject"></h1>
          <div class="message-meta">
            <span class="message-from" id="message-from"></span>
            <span class="message-date" id="message-date"></span>
            <span class="message-to" id="message-to"></span>
          </div>
          <div class="message-actions">
            <button class="secondary-button" id="reply-btn">↩ Ответить</button>
            <button class="secondary-button" id="reply-all-btn">↷ Всем</button>
            <button class="secondary-button" id="forward-btn">→ Переслать</button>
            <button class="danger-link" id="delete-btn">🗑 Удалить</button>
          </div>
        </header>
        <div class="message-body" id="message-body"></div>
        <div class="message-attachments" id="message-attachments"></div>
      </article>
    </aside>
  </div>

  <dialog id="compose-modal" class="modal compose-modal">
    <form method="dialog" id="compose-form">
      <div class="modal-head">
        <div>
          <div class="eyebrow">COMPOSE</div>
          <h3 id="compose-title">Новое письмо</h3>
        </div>
        <button class="modal-close" value="cancel">×</button>
      </div>
      <div class="compose-fields">
        <label>Кому<input name="to" type="email" placeholder="recipient@example.com" required></label>
        <label>Копия<input name="cc" type="email" placeholder="cc@example.com"></label>
        <label>Скрытая копия<input name="bcc" type="email" placeholder="bcc@example.com"></label>
        <label>Тема<input name="subject" placeholder="Тема письма" required></label>
      </div>
      <div class="compose-editor">
        <div class="editor-toolbar">
          <button type="button" class="format-btn" data-format="bold" title="Жирный"><b>B</b></button>
          <button type="button" class="format-btn" data-format="italic" title="Курсив"><i>I</i></button>
          <button type="button" class="format-btn" data-format="underline" title="Подчеркнутый"><u>U</u></button>
          <button type="button" class="format-btn" data-format="link" title="Ссылка">🔗</button>
        </div>
        <textarea name="body_html" class="editor-textarea" id="compose-editor" placeholder="Текст письма..."></textarea>
        <input type="hidden" name="body_text" id="compose-body-text">
      </div>
      <div class="compose-attachments">
        <label class="attachment-input">
          <input type="file" name="attachments" multiple id="attachments-input">
          <span>📎 Прикрепить файлы</span>
        </label>
        <div class="attached-files" id="attached-files"></div>
      </div>
      <div class="modal-actions">
        <button class="secondary-button" id="save-draft" value="draft">Сохранить черновик</button>
        <button class="secondary-button" value="cancel">Отмена</button>
        <button class="primary-button" id="send-btn" value="default">Отправить</button>
      </div>
      <input type="hidden" name="in_reply_to" id="compose-in-reply-to">
      <input type="hidden" name="references" id="compose-references">
      <input type="hidden" name="message_id" id="compose-message-id">
      <input type="hidden" name="password" id="compose-password">
    </form>
  </dialog>

  <dialog id="password-modal" class="modal">
    <form method="dialog" id="password-form">
      <div class="modal-head">
        <div><div class="eyebrow">SECURITY</div><h3>Пароль для IMAP/SMTP</h3></div>
        <button class="modal-close" value="cancel">×</button>
      </div>
      <p class="muted">Введите пароль почтового ящика для доступа к IMAP/SMTP</p>
      <label>Пароль<input name="password" type="password" required autocomplete="current-password"></label>
      <div class="modal-actions">
        <button class="secondary-button" value="cancel">Отмена</button>
        <button class="primary-button" value="default">Продолжить</button>
      </div>
    </form>
  </dialog>

  <script src="{{ url_for('static', filename='mail.js') }}"></script>
</body>
</html>
