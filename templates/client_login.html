<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Клиентский портал · Mailroom</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body class="login-page client-login"><main class="login-card"><div class="brand login-brand"><span class="brand-mark">M</span><span>Mailroom / Client</span></div><div class="eyebrow">MAILBOX PORTAL</div><h1>Ваш почтовый контур</h1><p class="muted">Вход для просмотра параметров ящика и управления паролем.</p><form id="client-login-form"><label>Адрес ящика<input name="address" type="email" placeholder="user@example.net" required autocomplete="username"></label><label>Пароль<input name="password" type="password" required autocomplete="current-password"></label><button class="primary-button login-button" type="submit">Войти в портал</button><div id="client-error" class="login-error hidden"></div></form><a class="portal-link" href="/login">Вход администратора →</a></main><script>document.querySelector('#client-login-form').addEventListener('submit',async e=>{e.preventDefault();const r=await fetch('/api/client/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});const d=await r.json();if(!r.ok){const x=document.querySelector('#client-error');x.textContent=d.error;x.classList.remove('hidden');return}location.href='/client'})</script></body></html>
