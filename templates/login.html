<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход · Mailroom</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="brand"><span class="brand-mark">M</span><span>Mailroom</span></div>
    <div class="eyebrow">Панель администратора</div>
    <h1>Вход</h1>
    <p class="muted">Управление доменами, ящиками и почтовым сервером.</p>
    <form id="login-form" autocomplete="on">
      <label class="field"><span>Логин</span><input name="username" required autocomplete="username" autofocus></label>
      <label class="field"><span>Пароль</span><input name="password" type="password" required autocomplete="current-password"></label>
      <label class="field hidden" id="otp-field"><span>Код из приложения 2FA</span>
        <input name="otp" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]{6,7}" maxlength="7"></label>
      <button class="primary-button" type="submit">Войти</button>
      <div id="login-error" class="form-error hidden" role="alert"></div>
    </form>
    <a class="portal-link" href="/mail/login">Веб-почта для пользователей →</a>
  </main>
  <script src="{{ url_for('static', filename='login.js') }}"></script>
</body>
</html>
