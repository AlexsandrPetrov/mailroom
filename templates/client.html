<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Клиентский портал · Mailroom</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body class="client-page"><main class="client-shell"><header class="client-header"><div class="brand"><span class="brand-mark">M</span><span>Mailroom / Client</span></div><button class="logout-button" id="client-logout">Выйти</button></header><section class="client-hero"><div class="eyebrow">MAILBOX PORTAL</div><h1 id="client-address">Загрузка...</h1><p>Параметры подключения к вашему почтовому ящику.</p></section><div class="client-grid"><article class="panel"><div class="eyebrow">CONNECTION</div><h3>Настройки клиента</h3><div id="connection-settings" class="connection-settings"></div></article><article class="panel"><div class="eyebrow">ACCOUNT SECURITY</div><h3>Смена пароля</h3><form id="client-password-form" class="client-form"><label>Текущий пароль<input name="current_password" type="password" required></label><label>Новый пароль<input name="new_password" type="password" minlength="14" required></label><button class="primary-button" type="submit">Изменить пароль</button><div id="client-message" class="login-error hidden"></div></form></article></div></main><script>const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));(async()=>{const r=await fetch('/api/client/me');if(!r.ok){location.href='/client/login';return}const d=await r.json();document.querySelector('#client-address').textContent=d.address;document.querySelector('#connection-settings').innerHTML=`<div class="connection-row"><span>IMAP over TLS</span><code>${esc(d.imap.host)}:993</code></div><div class="connection-row"><span>POP3 over TLS</span><code>${esc(d.imap.host)}:995</code></div><div class="connection-row"><span>SMTP Submission</span><code>${esc(d.smtp.host)}:${d.smtp.port}</code></div><div class="connection-row"><span>Квота</span><code>${d.quota_mb} МБ</code></div>`})();document.querySelector('#client-password-form').addEventListener('submit',async e=>{e.preventDefault();const x=document.querySelector('#client-message');const r=await fetch('/api/client/password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});const d=await r.json();x.textContent=r.ok?'Пароль изменён.':d.error;x.classList.remove('hidden');x.classList.toggle('success',r.ok)});document.querySelector('#client-logout').addEventListener('click',async()=>{await fetch('/api/client/logout',{method:'POST'});location.href='/client/login'})</script></body></html>
